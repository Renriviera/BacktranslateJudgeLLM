name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,analysis,sol,benchmarks]'
      - run: python bt.py audit
      - run: python bt.py verify-artifacts
      - run: python bt.py test
