# @package _global_
# SlotGCG target + judge run on OLMo-3-7B over the full StrongREJECT set.
defaults:
  - /model@subject_model: olmo3_7b_instruct
  - /model@base_model: olmo3_7b_base
  - /dataset@dataset: strongreject
  - /attack@attack: slotgcg
  - /judge@judges.strongreject: strongreject_ft
  - /judge@judges.harmbench: harmbench_llama
  - /metric@metrics.prefix: prefix_asr
  - /metric@metrics.judge: judge_asr
  - /metric@metrics.brass: brass

experiment_name: slotgcg_strongreject_olmo3_7b

attack:
  kwargs:
    cache_path: 06_Results_Artifacts/results/attacks/slotgcg/olmo3_7b_instruct.json
    strict: true

sampling:
  n_prompts: 313
  n_completions: 16
  temperature: 1.0
  top_p: 1.0
  max_tokens: 256
  base_max_tokens: 256

system_prompt: null
